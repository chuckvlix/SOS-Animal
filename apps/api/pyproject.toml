[project]
name = "sos-animal-api"
version = "0.1.0"
description = "Backend REST API for SOS Animal (LegalTech platform for animal protection in Sucre, Bolivia)"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "boto3>=1.44.2",
    "fastapi[standard]>=0.162.7",
    "psycopg[binary]>=3.3.9",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "sqlmodel>=0.0.50",
    "weasyprint>=70.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
